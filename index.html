<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION. LOADING... | OptoTech</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>

    <!-- 3D Environment -->
    <div class="scene">
        <div class="lens-flare" id="lens-flare"></div>
        <div class="floating-elements">
            <div class="element sphere-1"></div>
            <div class="element sphere-2"></div>
            <div class="element grid"></div>
        </div>
    </div>

    <header class="logo-container">
        <img src="opto.png" alt="OptoTech Logo" class="logo">
    </header>

    <main class="content">
        <div class="hero">
            <h1>VISION. LOADING…</h1>
            <p class="subtext">We’re upgrading your optical experience. <br>Something sharper is coming.</p>
        </div>

        <div class="contact-section">
            <p class="contact-prompt">Until we publish our site, contact us</p>
            <div class="contact-grid">
                <a href="https://wa.me/94777123456" class="contact-card whatsapp" target="_blank">
                    <div class="card-inner">
                        <i class="fab fa-whatsapp"></i>
                        <span class="label">WhatsApp</span>
                        <span class="value">+94 77 712 3456</span>
                    </div>
                </a>
                <a href="tel:+94777123456" class="contact-card phone">
                    <div class="card-inner">
                        <i class="fas fa-phone-alt"></i>
                        <span class="label">Call Now</span>
                        <span class="value">+94 77 712 3456</span>
                    </div>
                </a>
                <a href="#" class="contact-card location">
                    <div class="card-inner">
                        <i class="fas fa-map-marker-alt"></i>
                        <span class="label">Visit Us</span>
                        <span class="value">No. 123 Vision Avenue, Colombo</span>
                    </div>
                </a>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-line"></div>
            <p class="patience">thanks for the patience</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
